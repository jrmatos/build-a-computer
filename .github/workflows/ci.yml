name: CI

# Fork-safe (E-PLAT-07): this workflow uses `pull_request` (never
# `pull_request_target`), reads no secrets, and has a read-only token, so a PR
# from a fork runs the same checks with nothing to steal. Jobs that need
# secrets (e.g. static preview deploys) go in a separate workflow guarded by
#   if: github.event.pull_request.head.repo.full_name == github.repository
#
# No service containers: v1 has no backend or database (ADR-008).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  perf:
    name: Performance budgets
    # docs/plan.md: "CI blocks a merge on ... missed performance budget".
    # Runs every budget (frame time, adder settle, RV32 MIPS, first-level JS,
    # time to interactive) plus the FND-09 offline check; posts a table to the
    # job summary. Locally: `pnpm bench:ci`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright Chromium
        run: pnpm --filter @build-a-computer/bench exec playwright install --with-deps chromium

      - run: pnpm bench:ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: tools/bench/out/*.json
          if-no-files-found: ignore

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --target prod -t build-a-computer-web:ci .
